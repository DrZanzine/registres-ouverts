[project]
name = "registres-ouverts"
version = "0.1.0"
description = "Outillage ouvert et banc d'essai pour la lecture automatique (HTR) et l'indexation des registres d'état civil français du XIXe siècle."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ziane Menni" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Moteur HTR, lourd (torch) : installé seulement à la demande (uv sync --extra htr).
htr = ["kraken>=7.1,<8"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
