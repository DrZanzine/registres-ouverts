name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatage (ruff)
        run: uv run ruff format --check .

      - name: Tests (pytest)
        run: uv run pytest
